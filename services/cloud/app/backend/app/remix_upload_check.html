<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>混剪成片 · 本地上传联调</title>
<style>body{font:16px/1.7 system-ui;background:#f5f3ee;color:#183e55;margin:0}main{max-width:880px;margin:48px auto;padding:32px;background:white;border:1px solid #d6e3ed;border-radius:20px}h1{margin:0}p{color:#54748b}label{display:block;margin:18px 0}select,input,button{font:inherit;padding:10px;border:1px solid #bbd3e4;border-radius:8px}button{background:#0089d5;color:white;cursor:pointer}button:disabled{opacity:.5}progress,video{width:100%;margin-top:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 monospace;background:#f4f8fb;padding:16px}a{color:#0078be}.badge{background:#fff2cc;padding:8px;border-radius:8px}</style>
<main><div class="badge">本机模拟环境 · 文件进入独立的本地对象存储，不会访问真实 OSS</div>
<h1>混剪成片上传联调</h1><p>目标桶 marketing-video-dashboard · 前缀 wis/remix/ · 映射表 py_cloud_remix_assets</p>
<form id="upload"><label>产品分类 <select id="category" required><option value="">请选择产品</option></select></label>
<label>成片文件 <input id="file" type="file" accept="video/*,.mp4,.mov,.m4v,.webm,.avi,.mkv" required></label>
<button id="submit">上传并登记</button> <button id="refresh" type="button">刷新新素材列表</button></form>
<progress id="progress" value="0" max="100"></progress><p id="status" role="status">请选择分类及视频文件。</p>
<video id="preview" controls hidden></video><p><a id="download" hidden>下载原文件</a></p><pre id="result">尚无上传记录</pre><h2>新混剪素材</h2><div id="list"></div></main>
<script type="module">
const $=id=>document.getElementById(id);
const base=location.pathname.replace(/\/check\/?$/,'');
async function api(path,body,method){const r=await fetch(base+path,{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
async function load(){const data=await api('/assets');$('list').replaceChildren();for(const item of data.items){const p=document.createElement('p'),a=document.createElement('a');a.textContent=item.filename+' · '+item.category;a.href=item.preview_url;a.target='_blank';p.append(a);$('list').append(p)}if(!data.items.length)$('list').textContent='新素材库为空，请自行上传。'}
const config=await api('/categories');for(const item of config.items){const o=document.createElement('option');o.value=item.name;o.textContent=item.name;$('category').append(o)}await load();$('refresh').onclick=()=>load().catch(e=>$('status').textContent=e.message);
// WebCrypto supplies SHA-256; the MD5 implementation below supplies per-part
// checksums without an external CDN or remote request.
function md5(bytes){const n=bytes.length,buf=new Uint8Array(((n+8>>>6)+1)*64);buf.set(bytes);buf[n]=128;const v=new DataView(buf.buffer);v.setUint32(buf.length-8,n*8>>>0,true);v.setUint32(buf.length-4,Math.floor(n/0x20000000),true);let a=0x67452301,b=0xefcdab89,c=0x98badcfe,d=0x10325476;const s=[7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21],k=Array.from({length:64},(_,i)=>Math.floor(Math.abs(Math.sin(i+1))*4294967296));for(let off=0;off<buf.length;off+=64){let A=a,B=b,C=c,D=d;for(let i=0;i<64;i++){let f,g;if(i<16){f=B&C|~B&D;g=i}else if(i<32){f=D&B|~D&C;g=(5*i+1)%16}else if(i<48){f=B^C^D;g=(3*i+5)%16}else{f=C^(B|~D);g=7*i%16}let x=(A+f+k[i]+v.getUint32(off+g*4,true))|0,r=s[(i>>>4)*4+i%4];A=D;D=C;C=B;B=(B+((x<<r)|(x>>>(32-r))))|0}a=(a+A)|0;b=(b+B)|0;c=(c+C)|0;d=(d+D)|0}return[a,b,c,d].flatMap(x=>[0,8,16,24].map(s=>(x>>>s&255).toString(16).padStart(2,'0'))).join('')}
$('upload').onsubmit=async event=>{event.preventDefault();$('submit').disabled=true;let session;try{const file=$('file').files[0];$('status').textContent='正在校验文件…';const data=await file.arrayBuffer(),sha=[...new Uint8Array(await crypto.subtle.digest('SHA-256',data))].map(x=>x.toString(16).padStart(2,'0')).join('');const payload={filename:file.name,content_type:file.type||'video/mp4',size:file.size,sha256:sha,category:$('category').value};session=(await api('/uploads/lookup',payload)).session||await api('/uploads/sessions',payload);let parts=session.uploaded_parts||[];if(session.status!=='completed'){for(let number=1;number<=session.total_parts;number++){if(parts.some(p=>p.part_number===number))continue;$('status').textContent=`正在上传第 ${number}/${session.total_parts} 片`;const bytes=new Uint8Array(data.slice((number-1)*session.part_size,Math.min(number*session.part_size,data.byteLength)));const r=await fetch(base+`/uploads/sessions/${session.session_id}/parts/${number}`,{method:'PUT',headers:{'X-Upload-Part-Md5':md5(bytes)},body:bytes});const receipt=await r.json();if(!r.ok)throw Error(receipt.detail);parts.push(receipt);$('progress').value=Math.round(number/session.total_parts*90)}parts.sort((a,b)=>a.part_number-b.part_number);$('status').textContent='正在合并文件…';await api(`/uploads/sessions/${session.session_id}/complete`,{sha256:sha,parts})}$('status').textContent='正在写入新混剪映射表…';const asset=await api('/assets',{session_id:session.session_id});$('progress').value=100;$('status').textContent='上传、合并和登记完成。';$('result').textContent=JSON.stringify(asset,null,2);$('preview').src=asset.preview_url;$('preview').hidden=false;$('download').href=asset.download_url;$('download').hidden=false;await load()}catch(e){$('status').textContent='未完成：'+e.message+(session?'。原会话保留，重新选择同一文件及产品可继续。':'')}finally{$('submit').disabled=false}};
</script></html>
