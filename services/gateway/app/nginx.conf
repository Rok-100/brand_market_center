worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $http_cookie $has_wis_cookie { default 0; "~*(^|;)\s*wis_oa_session=" 1; }
  map $http_cookie $has_company_cookie { default 0; "~*(^|;)\s*authorization=" 1; }
  map $http_cookie $has_legacy_cookie { default 0; "~*(^|;)\s*oa-authorization=" 1; }
  map $http_x_oa_token $has_oa_header { default 1; '' 0; }
  log_format route '$request_method $uri $status $request_time wis=$has_wis_cookie company=$has_company_cookie legacy=$has_legacy_cookie oa_header=$has_oa_header target=$target';
  access_log /dev/stdout route;
  sendfile on;
  resolver 127.0.0.11 valid=30s ipv6=off;
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $upstream_http_content_type $wis_cloud_cache_control {
    default $upstream_http_cache_control;
    ~^text/html "private, no-cache, must-revalidate";
  }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 10g;
    client_body_timeout 600s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    location = /yxb/wis-marketing-hub { return 308 /yxb/wis-marketing-hub/; }

    location ^~ /yxb/wis-marketing-hub/modules/ai-first-creation/ {
      include /etc/nginx/proxy-headers.conf;
      set $target onecreation:3766;
      proxy_set_header X-Forwarded-Prefix /yxb/wis-marketing-hub/modules/ai-first-creation;
      proxy_pass http://$target;
    }
    # Legacy hub entry compatibility; keep the authenticated module root unchanged.
    location = /yxb/wis-marketing-hub/modules/material-workbench/remix.html {
      absolute_redirect off;
      return 307 /yxb/wis-marketing-hub/modules/material-workbench/$is_args$args;
    }
    location ^~ /yxb/wis-marketing-hub/modules/material-workbench/worker/ {
      include /etc/nginx/proxy-headers.conf;
      set $target remix:8787;
      rewrite ^/yxb/wis-marketing-hub/modules/material-workbench/worker/(.*)$ /$1 break;
      proxy_set_header X-Forwarded-Prefix /yxb/wis-marketing-hub/modules/material-workbench/worker;
      proxy_pass http://$target;
    }
    location ^~ /yxb/wis-marketing-hub/modules/material-workbench/ {
      include /etc/nginx/proxy-headers.conf;
      set $target remix:8787;
      rewrite ^/yxb/wis-marketing-hub/modules/material-workbench/(.*)$ /$1 break;
      proxy_set_header X-Forwarded-Prefix /yxb/wis-marketing-hub/modules/material-workbench;
      proxy_pass http://$target;
    }
    location = /yxb/wis-marketing-hub/modules/cloud-manager/api/auth/me {
      include /etc/nginx/proxy-headers.conf;
      set $target central-auth:3000;
      proxy_pass http://$target/api/central-auth/me;
    }

    location ^~ /yxb/wis-marketing-hub/modules/cloud-manager/ {
      proxy_hide_header Cache-Control;
      add_header Cache-Control $wis_cloud_cache_control always;
      include /etc/nginx/proxy-headers.conf;
      set $target cloud:3000;
      rewrite ^/yxb/wis-marketing-hub/modules/cloud-manager/(.*)$ /$1 break;
      proxy_set_header X-Forwarded-Prefix /yxb/wis-marketing-hub/modules/cloud-manager;
      proxy_pass http://$target;
    }
    location ^~ /yxb/wis-marketing-hub/modules/creative-hub/ {
      include /etc/nginx/proxy-headers.conf;
      set $target creative:3000;
      rewrite ^/yxb/wis-marketing-hub/modules/creative-hub/(.*)$ /$1 break;
      proxy_set_header X-Forwarded-Prefix /yxb/wis-marketing-hub/modules/creative-hub;
      proxy_pass http://$target;
    }
    location ^~ /yxb/wis-marketing-hub/modules/data-dashboard/ {
      include /etc/nginx/proxy-headers.conf;
      set $target dashboard:3000;
      rewrite ^/yxb/wis-marketing-hub/modules/data-dashboard/(.*)$ /$1 break;
      proxy_set_header X-Forwarded-Prefix /yxb/wis-marketing-hub/modules/data-dashboard;
      proxy_pass http://$target;
    }

    location ^~ /yxb/wis-marketing-hub/modules/live-room-management/ {
      include /etc/nginx/proxy-headers.conf;
      set $target live:3000;
      rewrite ^/yxb/wis-marketing-hub/modules/live-room-management/(.*)$ /$1 break;
      proxy_set_header X-Forwarded-Prefix /yxb/wis-marketing-hub/modules/live-room-management;
      proxy_pass http://$target;
    }
    location = /yxb/wis-marketing-hub/modules/data-center { return 308 /yxb/wis-marketing-hub/modules/data-center/; }
    # Vinext emits the configured assetPrefix but this pinned runtime only
    # serves /_next/static. The image duplicates that exact build output there.
    location ^~ /yxb/wis-marketing-hub/modules/data-center/_next/ {
      include /etc/nginx/proxy-headers.conf;
      set $target data-center:3000;
      rewrite ^/yxb/wis-marketing-hub/modules/data-center/_next/(.*)$ /_next/$1 break;
      proxy_set_header X-Forwarded-Prefix /yxb/wis-marketing-hub/modules/data-center;
      proxy_pass http://$target;
    }
    location ^~ /yxb/wis-marketing-hub/modules/data-center/ {
      include /etc/nginx/proxy-headers.conf;
      set $target data-center:3000;
      proxy_set_header X-Forwarded-Prefix /yxb/wis-marketing-hub/modules/data-center;
      proxy_pass http://$target;
    }
    location = /yxb/wis-marketing-hub/modules/dispatch-center { return 308 /yxb/wis-marketing-hub/modules/dispatch-center/; }
    location ^~ /yxb/wis-marketing-hub/modules/dispatch-center/ {
      include /etc/nginx/proxy-headers.conf;
      set $target dispatch:3000;
      rewrite ^/yxb/wis-marketing-hub/modules/dispatch-center/(.*)$ /$1 break;
      proxy_set_header X-Forwarded-Prefix /yxb/wis-marketing-hub/modules/dispatch-center;
      proxy_pass http://$target;
    }


    location ^~ /yxb/wis-marketing-hub/ {
      include /etc/nginx/proxy-headers.conf;
      set $target hub:3000;
      rewrite ^/yxb/wis-marketing-hub/(.*)$ /$1 break;
      proxy_set_header X-Forwarded-Prefix /yxb/wis-marketing-hub;
      proxy_pass http://$target;
    }
    location / { return 404; }
  }
}
