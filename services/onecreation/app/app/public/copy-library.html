<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>有效一创文案库｜品牌营销部工作站</title>
    <link rel="stylesheet" href="./styles.css?v=2.8.21" />
  </head>
  <body class="copy-library-body">
    <main class="copy-library-shell">
      <header class="copy-library-hero">
        <a class="copy-library-back" href="./">← 返回工作台首页</a>
        <div class="copy-library-heading">
          <div>
            <span class="copy-library-kicker">WIS CONTENT REFERENCE</span>
            <h1>WIS有效一创文案库</h1>
          </div>
          <a class="copy-library-source" id="copyLibrarySource" href="https://jqx28l0j4lx.feishu.cn/wiki/LPoJw9cnKiFBkyk9JQbcBI97nOe" target="_blank" rel="noopener">打开飞书源库 ↗</a>
        </div>
      </header>

      <section class="copy-library-notice" aria-label="使用提示">
        <strong>使用提示</strong>
        <span>完整原文已收录在工作台，可直接查看并带入一创或二创；当前产品事实、价格、功效与合规口径仍须按商品真值核验。</span>
      </section>

      <section class="copy-library-toolbar" aria-label="文案筛选">
        <label class="copy-library-search">
          <span>⌕</span>
          <input id="copySearch" type="search" placeholder="搜索题材、人物、脚本名称或原文内容" autocomplete="off" />
        </label>
        <div class="copy-library-filters" id="copyFilters" aria-label="脚本类型"></div>
      </section>

      <section class="copy-library-summary">
        <div><b id="copyVisibleCount">0</b><span>条可查看文案</span></div>
        <small>26篇完整原文已随工作台安装，并自动同步到部门文案云库 · 飞书修订 82</small>
      </section>

      <section class="copy-library-grid" id="copyLibraryGrid" aria-live="polite"></section>
      <div class="copy-library-empty" id="copyLibraryEmpty" hidden>没有找到对应文案，请换一个关键词或查看全部类型。</div>
    </main>
    <script src="./knowledge-context.js?v=2.8.21"></script>
    <script src="./copy-library.js?v=2.8.21"></script>
  </body>
</html>
