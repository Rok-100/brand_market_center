server {
    listen 8080;
    server_name _;
    client_max_body_size 130m;
    absolute_redirect off;
    location = / { return 302 /local-dev/; }
    location = /local-dev { return 302 /local-dev/; }
    location = /local-dev/ { root /usr/share/nginx/html; try_files /index.html =404; }
    location /local-dev/modules/cloud-manager/ {
        proxy_pass http://cloud:3000/;
        proxy_set_header X-Forwarded-Prefix /local-dev/modules/cloud-manager;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location /local-dev/api/ {
        proxy_pass http://cloud:3000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location / { return 404; }
}
