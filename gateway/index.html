<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>品牌营销中枢 · 本地开发</title>
<style>body{font:15px system-ui;color:#172b4d;background:#f3f6fb;margin:0}main{max-width:1000px;margin:auto;padding:36px 24px}h1{font-size:26px}section{background:white;border:1px solid #dce3ee;border-radius:14px;padding:24px;margin:20px 0}button,a.action{background:#175cd3;color:white;border:0;border-radius:7px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#edf2fa;color:#17447b}label{display:inline-block;margin:8px 12px 8px 0}input,select{padding:9px;border:1px solid #bbc8da;border-radius:6px}small,.muted{color:#53647d}#status{padding:12px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 5px;border-bottom:1px solid #eee;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6fa;padding:14px}nav{display:flex;gap:12px;flex-wrap:wrap}.error{color:#b42318}.ok{color:#087443}</style>
<main><h1>品牌营销中枢 · 本地开发</h1><p class="muted">真实素材上传、审核、视频处理和数据保存。OA 身份及外部平台投递使用本地模拟。</p>
<section><h2>选择本地身份</h2><nav><button data-role="admin">管理员</button><button data-role="manager">审核主管</button><button data-role="member">创作成员</button><button class="secondary" data-role="denied">未授权成员</button></nav><div id="status" aria-live="polite">请选择身份开始使用</div><a class="action" href="modules/cloud-manager/">进入素材与审核中心</a></section>
<section><h2>本地二创任务</h2><p>先在素材中心的“视频素材”上传原片，再填写素材 ID。FFmpeg 实际裁剪视频，完成后自动进入混剪素材库。</p><form id="render"><label>原片 ID <input name="source_asset_id" type="number" min="1" required></label><label>成片秒数 <input name="seconds" type="number" min="0.5" max="30" value="3" step="0.5"></label><button>创建二创任务</button></form></section>
<section><h2>外部投递模拟</h2><p>使用素材中心提交审核并审批后再投递。执行真实审核门禁，模拟平台成功、失败或超时，回执保存在本地。</p><form id="delivery"><label>素材 ID <input name="asset_id" type="number" min="1" required></label><label>素材库 <select name="library"><option value="remix">混剪成片</option><option value="source">视频原片</option></select></label><label>平台结果 <select name="outcome"><option value="success">成功</option><option value="failure">失败</option><option value="timeout">超时</option></select></label><button>创建模拟投递</button></form></section>
<section><h2>持久化任务记录 <button class="secondary" id="refresh">刷新</button></h2><p id="message" role="status"></p><table><thead><tr><th>任务</th><th>类型</th><th>状态</th><th>结果／错误</th></tr></thead><tbody id="jobs"></tbody></table><p class="muted">普通成员只能查看自己的任务；管理员可查看全部任务。重启容器不会清空素材和记录。</p></section></main>
<script type="module">
const base='/local-dev/api/local';const $=s=>document.querySelector(s);
async function call(path,body){const r=await fetch(base+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
async function refresh(){try{const d=await call('/jobs');$('#jobs').replaceChildren(...d.items.map(j=>{const tr=document.createElement('tr');for(const text of [j.id.slice(0,8),j.kind==='render'?'二创':'模拟投递',j.status,j.error||JSON.stringify(j.result)]){const td=document.createElement('td');td.textContent=text;tr.append(td)}return tr}));$('#message').textContent=''}catch(e){$('#message').textContent=e.message}}
for(const b of document.querySelectorAll('[data-role]'))b.onclick=async()=>{try{const d=await call('/login/'+b.dataset.role,{});$('#status').textContent='当前身份：'+d.user.realName;await refresh()}catch(e){$('#status').textContent=e.message}};
for(const [id,path]of [['render','/renders'],['delivery','/deliveries']])$('#'+id).onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));for(const k of ['source_asset_id','asset_id','seconds'])if(k in b)b[k]=Number(b[k]);b.idempotency_key=crypto.randomUUID();try{await call(path,b);await refresh()}catch(e){$('#message').textContent=e.message}};
$('#refresh').onclick=refresh;setInterval(refresh,5000);try{const d=await call('/session');$('#status').textContent='当前身份：'+d.user.realName;await refresh()}catch{}
</script></html>
