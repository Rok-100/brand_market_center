{
  "name": "brand-market-setup",
  "services": {
    "setup": {
      "image": "python:3.12-slim-bookworm",
      "user": "0:0",
      "working_dir": "/workspace",
      "command": [
        "python",
        "/workspace/local/prepare.py"
      ],
      "volumes": [
        {
          "type": "bind",
          "source": ".",
          "target": "/workspace"
        }
      ]
    }
  }
}
